# 법답대조.py --자가검사 가 돌린다.  사용자가 답을 바로잡으면 — CLAUDE.md 「법률 문답」 5 표에 한 줄 + 여기에 그 틀린 답 한 짝.
#   걸릴것 — 걸려야 할 갈래(① 글귀 없는 문장 · ② 근거에 없는 글귀 · ③ 판단 말 · ④ 근거 없음). 비우면 「걸리면 안 된다」
#   글월   — 걸린 글월에 들어 있어야 할 말 (어느 줄이 걸렸나)

- 이름: 10-05 출입문 0.8m — 내가 덧붙인 단서 (사용자가 바로잡음)
  걸릴것: ['①', '③']
  글월: ['안전하다']
  답: |
    **된다.** 기존 출입문 0.8m 는 종전 규정에 따른다. ← 「이 규칙 시행 당시 이미 설치되어 있는 편의시설에 관하여는」
    ⚠ **단서** — 문을 새로 달면 현행 0.9m 를 적용하는 것이 안전하다.

    ◆ 장애인ㆍ노인ㆍ임산부 등의 편의증진 보장에 관한 법률 시행규칙 부칙 <제557호,2018.2.9> 제3조
    > 제3조(장애인등의 출입이 가능한 출입구의 통과유효폭 등에 관한 경과조치) 이 규칙 시행 당시 이미 설치되어 있는 편의시설에 관하여는 별표 1 제6호가목(1)ㆍ(2), 제13호가목(3)(가)ㆍ나목(1)(다), 제19호나목(3) 및 제20호나목(1)ㆍ(3)부터 (6)까지의 개정규정에도 불구하고 종전의 규정에 따른다.

    법.db 기준: 2026-09-30

- 이름: 10-05 출입문 0.8m — 바로잡은 꼴 (걸리면 안 된다)
  걸릴것: []
  답: |
    **위반이 아니다.** ← 「이미 설치되어 있는 편의시설에 관하여는 … 개정규정에도 불구하고 종전의 규정에 따른다」
    종전 규정은 출입문 통과유효폭을 0.8미터 이상으로 정했다. ← 「0.8미터 이상」

    **근거**
    ◆ 장애인ㆍ노인ㆍ임산부 등의 편의증진 보장에 관한 법률 시행규칙 부칙 <제557호,2018.2.9> 제3조
    > 제3조(장애인등의 출입이 가능한 출입구의 통과유효폭 등에 관한 경과조치) 이 규칙 시행 당시 이미 설치되어 있는 편의시설에 관하여는 별표 1 제6호가목(1)ㆍ(2), 제13호가목(3)(가)ㆍ나목(1)(다), 제19호나목(3) 및 제20호나목(1)ㆍ(3)부터 (6)까지의 개정규정에도 불구하고 종전의 규정에 따른다.
    ◆ 같은 규칙 별표 1 제6호가목(1) — 종전 판(2018-08-09)
    > (1) 출입구(문)는 그 통과유효폭을 0.8미터 이상으로 하여야 하며, …

    **원문이 정하지 않은 것** — 원문은 문짝만 바꾸는 경우를 따로 정하지 않았다.
    **실무 조언(법 판단 아님)** — 허가권자와 미리 협의하는 것이 안전하다.

    법.db 기준: 2026-09-30

