- 이름: 근거 인용을 손으로 고쳐 씀 — 정북을 정남으로 (⑤ 법.db 대조)
  걸릴것: ['⑤']
  글월: ['남방향(正南方向)']
  답: |
    **조례가 정한다.** ← 「해당 지방자치단체의 조례로 정하는 바에 따라」

    ◆ 건축법 제61조(일조 등의 확보를 위한 건축물의 높이 제한) ① ④ — 시행 2026-02-27
    > ① 전용주거지역과 일반주거지역 안에서 건축하는 건축물의 높이는 일조 등의 확보를 위하여 정남방향(正南方向)의 인접 대지경계선으로부터의 거리에 따라 대통령령으로 정하는 높이 이하로 하여야 한다.
    > ④ 2층 이하로서 높이가 8미터 이하인 건축물에는 해당 지방자치단체의 조례로 정하는 바에 따라 제1항부터 제3항까지의 규정을 적용하지 아니할 수 있다.

    법.db 기준: 2026-09-30

