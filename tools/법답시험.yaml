# 법률 문답 시험 문제 — tools/법답시험.py 가 채점한다 (CLAUDE.md 「법률 문답」 6)
#
# 규칙(CLAUDE.md)ㆍ훅ㆍ자료를 바꾼 뒤에 몇 문제를 다시 풀려서 답이 흐트러지지 않았나 본다.
# 물음은 사무소 지난 문답(10_Ai/2_묻고답하기)과 사용자가 바로잡은 판단(CLAUDE.md 5 표)에서 골랐다.
#
#   물음   — 사용자가 채팅에 칠 말 그대로
#   출처   — 그 답이 정리된 자리 (사람이 맞다고 본 답)
#   꼭댈조 — 근거 머리(◆ Ⓐ …)에 꼭 나와야 할 조. 한 줄이 한 조건, ` | ` 는 「그중 하나」
#            「법령명 자리」 꼴 — 자리는 `제27조` · `별표 5` · `부칙` (빈칸은 무시하고 맞댄다)
#   결론   — 결론ㆍ단서 자리(첫 ◆ 앞)에 있어야 할 말. 한 줄이 한 조건, ` | ` 는 「그중 하나」
#   금지   — 답 어디에도 있으면 안 되는 말 (바로잡힌 판단에서 나온 것)
#
# ⚠ 「결론」 은 낱말 몇 개만 본다 — 답 전체가 맞는지는 사람이 본다. 기계는 「흐트러졌나」 의 신호다.
# 문제를 더할 때 — 사용자가 답을 바로잡으면 그 물음을 여기에도 한 문제로 넣는다.

